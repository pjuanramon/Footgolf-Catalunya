        function getHistoricalPlayer(normName, targetCategory, historical) {
            let searchCat = 'masculino';
            if (targetCategory === 'Absoluta') searchCat = 'masculino';
            // Improved mapping
            if (targetCategory === 'Rookie') searchCat = 'rookie';
            else if (targetCategory === 'Senior 55 +') searchCat = 'senior55';
            else if (targetCategory.includes('Senior')) searchCat = 'senior45';

            const catData = historical[searchCat];
            if (!catData) return null;

            return catData.find(p => normalizeName(p.name) === normName);
        }

        async function run() {
            try {
                const hist = await fetchHistorical();

                const res = await fetch('/docs/jornada_3.xlsx');
                const buf = await res.arrayBuffer();
                const wb = XLSX.read(buf, { type: 'array' });
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(sheet, { header: "A", defval: "" });

                const rows = data.slice(1); // skip visual header

                let players = [];
                rows.forEach(row => {
                    const rawName = String(row['D'] || "").trim();
                    if (!rawName) return;

                    const f = String(row['F']).trim().toUpperCase();
                    const didNotPlay = (f === 'NO' || f === '');
                    if (!rawName) return;

                    const normName = normalizeName(rawName);
                    const isUnlicensed = UNLICENSED.some(u => normName.includes(normalizeName(u)));
                    if (isUnlicensed) return;

                    const isNonRookie = NON_ROOKIES.some(nr => normalizeName(nr) === normName);

                    let score = row['Y'];
                    if (score === "" || score === undefined) score = 0;
                    else score = Number(score);

                    let cats = ["Absoluta"];
                    if (!isNonRookie) cats.push("Rookie");

                    let excelCat = String(row['C'] || "").trim();
                    if (excelCat.toLowerCase() === "caballeros" || excelCat.toLowerCase() === "masculina") {
                        excelCat = "";
                    }
                    if (excelCat && !cats.includes(excelCat)) cats.push(excelCat);

                    if (cats.includes("Senior 55 +") || excelCat === "Senior 55 +") {
                        if (!cats.includes("Senior 45 +")) cats.push("Senior 45 +");
                    }

                    players.push({ rawName, normName, isUnlicensed: false, score, categories: cats, didNotPlay });
                });

                // ADD MISSING HISTORICAL PLAYERS
                Object.values(hist).flat().forEach(hp => {
                    const hNormName = normalizeName(hp.name);
                    let existing = players.find(p => p.normName === hNormName);
                    
                    if (!existing) {
                        let cats = ["Absoluta"];
                        const isNonRookie = NON_ROOKIES.some(nr => normalizeName(nr) === hNormName);
                        if (!isNonRookie) cats.push("Rookie");
                        
                        // Check other categories in history
                        if (hist.senior45.some(s => normalizeName(s.name) === hNormName)) cats.push("Senior 45 +");
                        if (hist.senior55.some(s => normalizeName(s.name) === hNormName)) {
                            if (!cats.includes("Senior 55 +")) cats.push("Senior 55 +");
                            if (!cats.includes("Senior 45 +")) cats.push("Senior 45 +");
                        }

                        players.push({ 
                            rawName: hp.name, 
                            normName: hNormName, 
                            isUnlicensed: false, 
                            score: 0, 
                            categories: cats, 
                            didNotPlay: true 
                        });
                    }
                });

                let catGroups = {};
                players.forEach(p => {
                    p.categories.forEach(c => {
                        if (!catGroups[c]) catGroups[c] = [];
                        // Clone to avoid overwriting jornadaRank between categories
                        catGroups[c].push({ ...p });
                    });
                });

                let finalResults = {};
                let tieDetected = null;

                for (const cat in catGroups) {
                    let presentPlayers = catGroups[cat].filter(p => !p.didNotPlay);
                    let absentPlayers = catGroups[cat].filter(p => p.didNotPlay);

                    let sorted = presentPlayers.sort((a, b) => a.score - b.score);

                    let groupedByScore = [];
                    sorted.forEach(p => {
                        if (groupedByScore.length > 0 && groupedByScore[groupedByScore.length - 1].score === p.score) {
                            groupedByScore[groupedByScore.length - 1].players.push(p);
                        } else {
                            groupedByScore.push({ score: p.score, players: [p] });
                        }
                    });

                    let currentRank = 1;
                    let processedPlayers = [];

                    for (let group of groupedByScore) {
                        let licensed = group.players.filter(p => !p.isUnlicensed);
                        let unlicensed = group.players.filter(p => p.isUnlicensed);

                        if (licensed.length > 1) {
                            // Manual Tie Resoluion
                            let isResolvedTie = false;

                            // Absoluta: Jorge 1st (-9), Eduardo 2nd (-9)
                            if (group.score === -9 && licensed.length === 2 &&
                                licensed.some(p => p.normName === "jorge santiago buqueras") &&
                                licensed.some(p => p.normName === "eduardo martin rodriguez")) {

                                isResolvedTie = true;
                                let jorge = licensed.find(p => p.normName === "jorge santiago buqueras");
                                let eduardo = licensed.find(p => p.normName === "eduardo martin rodriguez");
                                licensed = [jorge, eduardo];
                            }

                            // Rookie: Ivan 2nd (-3), Daniel 3rd (-3)
                            if (group.score === -3 && licensed.length === 2 &&
                                licensed.some(p => p.normName === "ivan luengo robles") &&
                                licensed.some(p => p.normName === "daniel abril amador")) {

                                isResolvedTie = true;
                                // Enforce Ivan > Daniel
                                let ivan = licensed.find(p => p.normName === "ivan luengo robles");
                                let daniel = licensed.find(p => p.normName === "daniel abril amador");
                                licensed = [ivan, daniel];
                            }

                            if (currentRank <= 3 && !isResolvedTie) {
                                tieDetected = {
                                    category: cat,
                                    scores: group.score,
                                    players: licensed.map(p => p.rawName),
                                    positions: `${currentRank} to ${currentRank + licensed.length - 1}`
                                };
                                break;
                            }

                            if (isResolvedTie) {
                                // Assign specific points for 1st and 2nd
                                licensed.forEach((p, idx) => {
                                    p.jornadaRank = currentRank + idx;
                                    p.jornadaPoints = POINTS_TABLE[currentRank + idx] || 0;
                                    processedPlayers.push(p);
                                });
                            } else {
                                // Average points for non-top-3 ties
                                let totalPts = 0;
                                for (let i = 0; i < licensed.length; i++) {
                                    totalPts += (POINTS_TABLE[currentRank + i] || 0);
                                }
                                let avgPts = totalPts / licensed.length;

                                licensed.forEach(p => {
                                    p.jornadaRank = currentRank;
                                    p.jornadaPoints = avgPts;
                                    processedPlayers.push(p);
                                });
                            }

                            unlicensed.forEach(p => {
                                p.jornadaRank = currentRank;
                                p.jornadaPoints = 0;
                                processedPlayers.push(p);
                            });

                            currentRank += licensed.length;
                        } else if (licensed.length === 1) {
                            let p = licensed[0];
                            p.jornadaRank = currentRank;
                            p.jornadaPoints = POINTS_TABLE[currentRank] || 0;
                            processedPlayers.push(p);

                            unlicensed.forEach(up => {
                                up.jornadaRank = currentRank;
                                up.jornadaPoints = 0;
                                processedPlayers.push(up);
                            });

                            currentRank += 1;
                        } else {
                            unlicensed.forEach(up => {
                                up.jornadaRank = currentRank;
                                up.jornadaPoints = 0;
                                processedPlayers.push(up);
                            });
                        }
                    }

                    absentPlayers.forEach(p => {
                        p.jornadaRank = null;
                        p.jornadaPoints = 0;
                        processedPlayers.push(p);
                    });

                    if (tieDetected) break;

                    processedPlayers.forEach(p => {
                        let histP = getHistoricalPlayer(p.normName, cat, hist);
                        let e1 = histP ? (histP.e1 || 0) : 0;
                        let e2 = histP ? (histP.e2 || 0) : 0;
                        let e3 = p.jornadaPoints;

                        let scoresArray = [e1, e2, e3].sort((a, b) => b - a);
                        let best8 = scoresArray.slice(0, 8).reduce((sum, val) => sum + val, 0);

                        p.history = { e1, e2, e3 };
                        p.total = best8;
                    });

                    processedPlayers.sort((a, b) => b.total - a.total);

                    processedPlayers.forEach((p, idx) => {
                        p.pos = idx + 1;
                    });

                    finalResults[cat] = processedPlayers.map(p => ({
                        pos: p.pos,
                        name: p.rawName,
                        e1: p.history.e1,
                        e2: p.history.e2,
                        e3: p.history.e3,
                        total: p.total,
                        isUnlicensed: p.isUnlicensed
                    }));
                }

                if (tieDetected) {
                    document.getElementById('status').textContent = "TIE_DETECTED";
                    document.getElementById('output').textContent = JSON.stringify(tieDetected, null, 2);
                } else {
                    document.getElementById('status').textContent = "SUCCESS";
                    document.getElementById('output').textContent = JSON.stringify({
                        jornada: JORNADA_NUM,
                        categorias: finalResults
                    }, null, 2);
                }

            } catch (e) {
                document.getElementById('status').textContent = "ERROR";
                document.getElementById('output').textContent = e.stack || e.toString();
            }
        }
        run();
