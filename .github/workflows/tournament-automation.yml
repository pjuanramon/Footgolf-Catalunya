name: Tournament Automation

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC (00:00 CEST tras cierre miércoles 23:59 en horario de verano)
    - cron: '0 23 * * *' # 23:00 UTC (00:00 CET tras cierre miércoles 23:59 en horario de invierno)
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Tournament Automation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node scripts/automate-tournament.js
