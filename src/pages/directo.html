<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat de Campo · Finales 2026 - Footgolf Catalunya</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="icon" type="image/png" href="/favicon.png?v=1">
    <style>
        :root {
            --bg-page: #030712;
            --card-bg: rgba(17, 24, 39, 0.85);
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #22c55e;
            --accent: #fbbf24;
            --purple: #a855f7;
        }

        body {
            background-color: var(--bg-page);
            color: #f3f4f6;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .chat-header {
            background: linear-gradient(135deg, rgba(30, 143, 58, 0.25), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 1.25rem;
            padding: 1.25rem 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .chat-header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #22c55e, #fbbf24);
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 0.2rem 0.7rem;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse-dot 1.2s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .input-card {
            background: var(--card-bg);
            border: 1px solid var(--border-card);
            border-radius: 1.25rem;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 0.85rem;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #9ca3af;
            margin-bottom: 0.35rem;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.75rem;
            padding: 0.75rem 0.9rem;
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
            background: rgba(15, 23, 42, 1);
        }

        textarea {
            resize: none;
            height: 80px;
        }

        .btn-send {
            width: 100%;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            padding: 0.85rem;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-send:active {
            transform: scale(0.98);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.5rem;
            padding: 0 0.25rem;
        }

        .feed-header h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-refresh {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            border-radius: 0.5rem;
            padding: 0.35rem 0.75rem;
            font-size: 0.78rem;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s;
        }

        .btn-refresh:hover {
            color: white;
            background: rgba(255, 255, 255, 0.12);
        }

        .report-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .report-item {
            background: var(--card-bg);
            border: 1px solid var(--border-card);
            border-radius: 1rem;
            padding: 1rem 1.15rem;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .report-top {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.45rem;
        }

        .report-author {
            font-weight: 800;
            color: white;
            font-size: 0.9rem;
        }

        .badge-match {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 9999px;
            padding: 0.15rem 0.55rem;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .badge-hole {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 9999px;
            padding: 0.15rem 0.55rem;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .report-time {
            margin-left: auto;
            color: #6b7280;
            font-size: 0.75rem;
            font-variant-numeric: tabular-nums;
        }

        .report-text {
            margin: 0;
            color: #e5e7eb;
            font-size: 0.92rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            transition: color 0.2s;
        }

        .nav-back:hover {
            color: #22c55e;
        }
    </style>
</head>

<body>
    <div class="chat-container">

        <!-- HEADER -->
        <div>
            <a href="/src/pages/equipos.html" class="nav-back">← Volver a la Portada de Equipos</a>
            <div class="chat-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <div class="live-badge">
                        <span class="pulse-dot"></span>
                        <span>CANAL DE CAMPO</span>
                    </div>
                    <span style="font-size: 0.8rem; color: #9ca3af;">La Garriga · Hoy</span>
                </div>
                <h1 style="font-size: 1.5rem; font-weight: 900; margin: 0 0 0.25rem; color: white;">
                    📢 Envía tu Reporte en Directo
                </h1>
                <p style="margin: 0; color: #cbd5e1; font-size: 0.85rem; line-height: 1.4;">
                    Escribe lo que va sucediendo en tu hoyo o partido. La narración oficial y los marcadores se nutrirán con tus datos al instante.
                </p>
            </div>
        </div>

        <!-- FORMULARIO DE ENVÍO -->
        <div class="input-card">
            <form id="report-form" onsubmit="enviarReporte(event)">
                <div class="input-row">
                    <div class="form-group">
                        <label for="autor">Tu Nombre / Equipo *</label>
                        <input type="text" id="autor" placeholder="Ej: JuanRa / BCN" required autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="hoyo">Hoyo (opcional)</label>
                        <select id="hoyo">
                            <option value="">Selecciona hoyo...</option>
                            <option value="Hoyo 1">Hoyo 1</option>
                            <option value="Hoyo 2">Hoyo 2</option>
                            <option value="Hoyo 3">Hoyo 3</option>
                            <option value="Hoyo 4">Hoyo 4</option>
                            <option value="Hoyo 5">Hoyo 5</option>
                            <option value="Hoyo 6">Hoyo 6</option>
                            <option value="Hoyo 7">Hoyo 7</option>
                            <option value="Hoyo 8">Hoyo 8</option>
                            <option value="Hoyo 9">Hoyo 9</option>
                            <option value="Hoyo 10">Hoyo 10</option>
                            <option value="Hoyo 11">Hoyo 11</option>
                            <option value="Hoyo 12">Hoyo 12</option>
                            <option value="Hoyo 13">Hoyo 13</option>
                            <option value="Hoyo 14">Hoyo 14</option>
                            <option value="Hoyo 15">Hoyo 15</option>
                            <option value="Hoyo 16">Hoyo 16</option>
                            <option value="Hoyo 17">Hoyo 17</option>
                            <option value="Hoyo 18">Hoyo 18</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="partido">Partido / Duelo</label>
                    <select id="partido">
                        <option value="SF1: Barcelona vs Bacho Kiro">SF1: Barcelona vs Bacho Kiro</option>
                        <option value="SF2: Apex vs AC Maktub">SF2: Apex vs AC Maktub</option>
                        <option value="🏆 Gran Final">🏆 Gran Final</option>
                        <option value="🥉 Partido 3.º Puesto">🥉 Partido 3.º Puesto</option>
                        <option value="General">General / Varios</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="texto">¿Qué ha pasado? *</label>
                    <textarea id="texto" placeholder="Ej: Acabamos el hoyo 4, ganamos por 1 golpe. Resultado Foursome 3-1..." required></textarea>
                </div>

                <button type="submit" id="btn-submit" class="btn-send">
                    <span>🚀</span>
                    <span>Enviar reporte al directo</span>
                </button>
            </form>
        </div>

        <!-- LISTA DE REPORTES EN VIVO -->
        <div>
            <div class="feed-header">
                <h3><span>📡</span> Reportes de Campo en Vivo</h3>
                <button type="button" class="btn-refresh" onclick="cargarReportes(true)">
                    <span id="refresh-icon">🔄</span> Actualizar
                </button>
            </div>

            <div id="report-list" class="report-list" style="margin-top: 0.75rem;">
                <div class="empty-state">Cargando reportes del campo...</div>
            </div>
        </div>

    </div>

    <script>
        // Cargar autor guardado en localStorage
        const autorInput = document.getElementById('autor');
        if (localStorage.getItem('directo_autor')) {
            autorInput.value = localStorage.getItem('directo_autor');
        }

        autorInput.addEventListener('input', (e) => {
            localStorage.setItem('directo_autor', e.target.value.trim());
        });

        async function cargarReportes(manual = false) {
            const refreshIcon = document.getElementById('refresh-icon');
            if (manual && refreshIcon) refreshIcon.style.transform = 'rotate(180deg)';

            try {
                const res = await fetch('/api/directo/mensajes?t=' + Date.now());
                const data = await res.json();
                
                const listContainer = document.getElementById('report-list');
                if (!data.ok || !data.reportes || data.reportes.length === 0) {
                    listContainer.innerHTML = `
                        <div class="empty-state">
                            ⛳ Todavía no hay reportes de campo.<br>¡Sé el primero en enviar información de tu hoyo!
                        </div>
                    `;
                    return;
                }

                listContainer.innerHTML = data.reportes.map(r => `
                    <div class="report-item">
                        <div class="report-top">
                            <span class="report-author">${escapeHtml(r.autor || 'Jugador')}</span>
                            ${r.partido ? `<span class="badge-match">${escapeHtml(r.partido)}</span>` : ''}
                            ${r.hoyo ? `<span class="badge-hole">${escapeHtml(r.hoyo)}</span>` : ''}
                            <span class="report-time">${escapeHtml(r.fecha || '')}</span>
                        </div>
                        <p class="report-text">${escapeHtml(r.texto || '')}</p>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Error al cargar reportes:', err);
            } finally {
                if (manual && refreshIcon) {
                    setTimeout(() => refreshIcon.style.transform = 'none', 300);
                }
            }
        }

        async function enviarReporte(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const textoInput = document.getElementById('texto');
            const autor = document.getElementById('autor').value.trim();
            const hoyo = document.getElementById('hoyo').value;
            const partido = document.getElementById('partido').value;
            const texto = textoInput.value.trim();

            if (!texto) return;

            btn.disabled = true;
            btn.innerHTML = '<span>⏳</span> Enviando...';

            try {
                const res = await fetch('/api/directo/enviar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ autor, hoyo, partido, texto })
                });
                const data = await res.json();

                if (data.ok) {
                    textoInput.value = '';
                    await cargarReportes();
                } else {
                    alert('Error al enviar: ' + (data.error || 'Inténtalo de nuevo'));
                }
            } catch (err) {
                alert('Fallo de conexión al enviar el reporte.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>🚀</span> Enviar reporte al directo';
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Carga inicial y sondeo automático cada 10 segundos
        cargarReportes();
        setInterval(cargarReportes, 10000);
    </script>
</body>

</html>
