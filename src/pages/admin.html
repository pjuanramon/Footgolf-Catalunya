<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Footgolf Catalunya</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/main.css">
    <style>
        :root {
            --admin-bg: #0f172a;
            --admin-card: #1e293b;
            --admin-border: #334155;
        }
        body.admin-body {
            background: var(--admin-bg);
            color: white;
            padding: 2rem;
            font-family: 'Outfit', sans-serif;
        }
        .login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--admin-bg);
            display: flex;
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .login-card {
            background: var(--admin-card);
            padding: 2.5rem;
            border-radius: 1.5rem;
            border: 1px solid var(--admin-border);
            width: 100%; max-width: 400px;
            text-align: center;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }
        .tab-nav {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--admin-border);
            padding-bottom: 1rem;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }
        .admin-card {
            background: var(--admin-card);
            border-radius: 1.25rem;
            border: 1px solid var(--admin-border);
            overflow: hidden;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: rgba(255,255,255,0.05);
            text-align: left;
            padding: 1rem 1.5rem;
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--admin-border);
        }
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-warn { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .badge-error { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        
        button.btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }
        
        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--admin-card);
            border: 1px solid var(--admin-border);
            padding: 2rem;
            border-radius: 1.5rem;
            z-index: 1100;
            width: 90%; max-width: 600px;
            display: none;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1050;
            display: none;
        }
    </style>
    <link rel="icon" type="image/png" href="/favicon.png?v=1">
</head>
<body class="admin-body">
    
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <h2 style="margin-bottom: 1rem;">Acceso Admin</h2>
            <input type="password" id="secretInput" placeholder="Clave Administrador" class="btn" style="background: var(--admin-bg); color: white; width: 100%; margin-bottom: 1rem;">
            <button onclick="handleLogin()" class="btn btn-primary" style="width: 100%;">Entrar →</button>
        </div>
    </div>

    <div class="admin-header">
        <h1 class="gradient-text">Panel Control 2026</h1>
        <button onclick="logout()" class="btn btn-sm" style="background: var(--admin-border);">Cerrar Sesión</button>
    </div>

    <nav class="tab-nav">
        <button onclick="showTab('jugadores')" id="tab-jugadores" class="tab-btn active">Jugadores</button>
        <button onclick="showTab('torneos')" id="tab-torneos" class="tab-btn">Torneos 2026</button>
    </nav>

    <!-- Tab Jugadores -->
    <div id="tabContent-jugadores" class="tab-content">
        <div style="display:flex; justify-content:flex-end; margin-bottom:1rem">
            <button onclick="openModal('nuevo-jugador')" class="btn btn-primary btn-sm">+ Nuevo Jugador</button>
        </div>
        <div class="admin-card">
            <table>
                <thead>
                    <tr>
                        <th>Nickname</th>
                        <th>Nombre Completo</th>
                        <th>Email / Telefono</th>
                        <th>Edad / Género</th>
                        <th>Club</th>
                        <th>Licencia 2026</th>
                        <th>Categorías</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="jugadoresTable">
                    <!-- Injected -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Tab Torneos -->
    <div id="tabContent-torneos" class="tab-content" style="display: none;">
        <div class="admin-card">
            <table>
                <thead>
                    <tr>
                        <th>Etapa</th>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="torneosTable">
                    <!-- Injected -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="overlay" class="overlay" onclick="closeModal()"></div>
    <div id="modal" class="modal">
        <h3 id="modalTitle" style="margin-bottom: 1.5rem;">Título</h3>
        <div id="modalContent" style="max-height: 400px; overflow-y: auto;">
            <!-- Injected -->
        </div>
        <button onclick="closeModal()" class="btn btn-primary" style="margin-top: 1.5rem; width: 100%;">Cerrar</button>
    </div>

    <script>
        // --- Manejo de Errores Global ---
        window.onerror = function(msg, url, line) {
            alert("ERROR CRÍTICO JS: " + msg + "\nEn: " + url + ":" + line);
            return false;
           // --- Estado Global ---
        let state = {
            jugadores: [],
            torneos: [],
            rankingNames: [],
            adminSecret: localStorage.getItem('adminSecret')
        };

        console.log("ADMIN: Código cargado correctamente v2.");

        // Helpers
        function normalizeString(s) {
            if (!s) return '';
            return s.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, " ").replace(/\s+/g, " ").trim();
        }

        function getLevenshtein(a, b) {
            const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    matrix[i][j] = b[i - 1] === a[j - 1] ? matrix[i - 1][j - 1] : Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                }
            }
            return matrix[b.length][a.length];
        }

        function findBestMatch(player, officialNames) {
            if (!Array.isArray(officialNames) || officialNames.length === 0) return null;
            const pNick = normalizeString(player.nickname);
            const pName = normalizeString(player.nombre_completo);
            let best = null;
            let bestDist = 999;
            for (const offName of officialNames) {
                const normOff = normalizeString(offName);
                if (normOff === pNick || normOff === pName) return { name: offName, type: 'exact' };
                const dist = Math.min(getLevenshtein(pNick, normOff), getLevenshtein(pName, normOff));
                if (dist < bestDist) { bestDist = dist; best = offName; }
            }
            return bestDist <= 3 ? { name: best, type: 'fuzzy' } : null;
        }

        async function api(path, method = 'GET', body = null) {
            const headers = { 'x-admin-secret': state.adminSecret, 'Content-Type': 'application/json' };
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            try {
                const res = await fetch(`/api/${path}`, options);
                if (res.status === 401) { logout(); return null; }
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error en la petición');
                return data;
            } catch (err) {
                alert("API FAIL: " + err.message);
                return null;
            }
        }

        async function handleLogin(explicitSecret = null) {
            state.adminSecret = explicitSecret || document.getElementById('secretInput').value;
            const data = await api('admin/jugadores');
            if (data) {
                localStorage.setItem('adminSecret', state.adminSecret);
                document.getElementById('loginOverlay').style.display = 'none';
                renderData();
            } else if (!explicitSecret) {
                alert('Clave incorrecta');
            }
        }

        function logout() { localStorage.removeItem('adminSecret'); location.reload(); }
        
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tabContent-${tab}`).style.display = 'block';
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        async function renderData() {
            const [jugadores, torneos, rankingNames] = await Promise.all([
                api('admin/jugadores'),
                api('etapas/listado'),
                api('admin/clasificacion-nombres')
            ]);
            state.jugadores = jugadores || [];
            state.torneos = torneos || [];
            state.rankingNames = rankingNames || [];
            
            document.getElementById('jugadoresTable').innerHTML = state.jugadores.map((j, idx) => {
                const match = j.tiene_licencia ? findBestMatch(j, state.rankingNames) : null;
                const matchText = match ? `Nick: <b>${match.name}</b>` : (j.tiene_licencia ? '⚠️ No encontrado' : '');
                return `<tr><td><b>${j.nickname}</b><br><small>${matchText}</small></td><td>${j.nombre_completo || '-'}</td><td>${j.email}</td><td>${j.fecha_nacimiento || '-'}</td><td>${j.club || '-'}</td><td><span class="badge ${j.tiene_licencia ? 'badge-success' : 'badge-error'}">${j.tiene_licencia ? 'SÍ' : 'NO'}</span></td><td>${(j.categorias_calculadas || []).join(', ') || '-'}</td><td><button onclick="uiEditJugador(${idx})" class="btn btn-sm">Editar</button></td></tr>`;
            }).join('');

            document.getElementById('torneosTable').innerHTML = state.torneos.map((t, idx) => `<tr><td>${t.nombre}</td><td>${new Date(t.fecha).toLocaleDateString()}</td><td>${t.tipo}</td><td>${t.estado}</td><td><button onclick="uiCargarResultados(${idx})" class="btn btn-sm btn-primary">Cargar</button></td></tr>`).join('');
        }

        function uiEditJugador(idx) { openModal('editar-jugador', state.jugadores[idx]); }
        function uiCargarResultados(idx) { state.activeEtapa = state.torneos[idx]; openModal('cargar-resultados', state.activeEtapa); }

        function openModal(type, extra = null) {
            const content = document.getElementById('modalContent');
            document.getElementById('modalTitle').textContent = type.toUpperCase();
            if (type === 'cargar-resultados') {
                content.innerHTML = `
                    <div id="step-upload">
                        <input type="file" id="excelInput" class="btn" style="width:100%"><br><br>
                        <button onclick="processStepPreview()" class="btn btn-primary" style="width:100%">Analizar</button>
                    </div>
                    <div id="step-loading" style="display:none; padding:1rem">⌛ Procesando...</div>
                    <div id="step-ties" style="display:none">
                        <div id="tiesList"></div>
                        <button onclick="console.log('Click en Recalcular'); processStepPreview(true)" class="btn btn-primary" style="width:100%; margin-top:1rem">Recalcular con Desempates</button>
                    </div>
                    <div id="step-preview" style="display:none">
                        <div id="previewTable"></div>
                        <button onclick="processStepPublish()" class="btn btn-primary" style="width:100%; margin-top:1rem">Publicar</button>
                    </div>
                    <div id="debugLogs" style="background:#000; color:#4ade80; padding:10px; font-size:0.7rem; margin-top:10px; max-height:100px; overflow:auto; display:none"></div>
                `;
            }
            document.getElementById('modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }

        // --- Lógica del Proceso ---
        let currentFileBase64 = null;
        let currentDesempates = {};

        function showStep(s) {
            ['upload','loading','ties','preview'].forEach(x => document.getElementById(`step-${x}`).style.display = (x===s?'block':'none'));
        }

        async function processStepPreview(isRetry = false) {
            console.log("ADMIN: Iniciando Análisis...");
            if (!isRetry) {
                const file = document.getElementById('excelInput').files[0];
                if (!file) return alert("Selecciona archivo");
                const reader = new FileReader();
                reader.onload = (e) => { currentFileBase64 = e.target.result.split(',')[1]; sendPreview(); };
                reader.readAsDataURL(file);
            } else {
                sendPreview();
            }
        }

        async function sendPreview() {
            showStep('loading');
            const res = await api('clasificacion/procesar-etapa', 'POST', {
                etapa_id: state.activeEtapa.id,
                excel_base64: currentFileBase64,
                mode: 'preview',
                desempates: currentDesempates
            });
            if (!res) { showStep('upload'); return; }
            
            if (res.logs) {
                const dl = document.getElementById('debugLogs');
                dl.style.display = 'block';
                dl.innerHTML = res.logs.map(l => `<div>> ${l}</div>`).join('');
            }

            if (res.empatesDetectados && res.empatesDetectados.length > 0) {
                showStep('ties');
                document.getElementById('tiesList').innerHTML = res.empatesDetectados.map(e => `
                    <div style="margin-bottom:1rem">
                        <b>${e.categoria}</b><br>
                        ${e.jugadores.map(j => `<button onclick="resolveTie('${j.id}')" class="btn btn-sm ${currentDesempates[j.id]?'btn-primary':''}">${j.nickname}</button>`).join(' ')}
                    </div>`).join('');
            } else {
                showStep('preview');
                document.getElementById('previewTable').innerHTML = `<table style="font-size:0.8rem">` + res.puntosCalculados.map(p => `<tr><td>${p.nickname}</td><td>${p.score}</td><td>${JSON.stringify(p.puntos)}</td></tr>`).join('') + `</table>`;
            }
        }

        function resolveTie(id) { 
            console.log("Resolviendo para:", id);
            currentDesempates[id] = true; 
            sendPreview(); 
        }

        async function processStepPublish() {
            if (!confirm("¿Publicar?")) return;
            showStep('loading');
            const res = await api('clasificacion/procesar-etapa', 'POST', {
                etapa_id: state.activeEtapa.id,
                excel_base64: currentFileBase64,
                mode: 'commit',
                desempates: currentDesempates
            });
            if (res && res.ok) { alert("¡Éxito!"); closeModal(); renderData(); }
        }

        if (state.adminSecret) handleLogin(state.adminSecret);
    </script>
</body>
</html>
