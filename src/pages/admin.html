<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Footgolf Catalunya</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/main.css">
    <style>
        :root {
            --admin-bg: #0f172a;
            --admin-card: #1e293b;
            --admin-border: #334155;
        }
        body.admin-body {
            background: var(--admin-bg);
            color: white;
            padding: 2rem;
            font-family: 'Outfit', sans-serif;
        }
        .login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--admin-bg);
            display: flex;
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .login-card {
            background: var(--admin-card);
            padding: 2.5rem;
            border-radius: 1.5rem;
            border: 1px solid var(--admin-border);
            width: 100%; max-width: 400px;
            text-align: center;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }
        .tab-nav {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--admin-border);
            padding-bottom: 1rem;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }
        .admin-card {
            background: var(--admin-card);
            border-radius: 1.25rem;
            border: 1px solid var(--admin-border);
            overflow: hidden;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: rgba(255,255,255,0.05);
            text-align: left;
            padding: 1rem 1.5rem;
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--admin-border);
        }
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-warn { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .badge-error { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        
        button.btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }
        
        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--admin-card);
            border: 1px solid var(--admin-border);
            padding: 2rem;
            border-radius: 1.5rem;
            z-index: 1100;
            width: 90%; max-width: 600px;
            display: none;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1050;
            display: none;
        }
    </style>
    <link rel="icon" type="image/png" href="/favicon.png?v=1">
</head>
<body class="admin-body">
    
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <h2 style="margin-bottom: 1rem;">Acceso Admin</h2>
            <input type="password" id="secretInput" placeholder="Clave Administrador" class="btn" style="background: var(--admin-bg); color: white; width: 100%; margin-bottom: 1rem;">
            <button onclick="handleLogin()" class="btn btn-primary" style="width: 100%;">Entrar →</button>
        </div>
    </div>

    <div class="admin-header">
        <h1 class="gradient-text">Panel Control 2026</h1>
        <button onclick="logout()" class="btn btn-sm" style="background: var(--admin-border);">Cerrar Sesión</button>
    </div>

    <nav class="tab-nav">
        <button onclick="showTab('jugadores')" id="tab-jugadores" class="tab-btn active">Jugadores</button>
        <button onclick="showTab('torneos')" id="tab-torneos" class="tab-btn">Torneos 2026</button>
    </nav>

    <!-- Tab Jugadores -->
    <div id="tabContent-jugadores" class="tab-content">
        <div style="display:flex; justify-content:flex-end; margin-bottom:1rem">
            <button onclick="openModal('nuevo-jugador')" class="btn btn-primary btn-sm">+ Nuevo Jugador</button>
        </div>
        <div class="admin-card">
            <table>
                <thead>
                    <tr>
                        <th>Nickname</th>
                        <th>Nombre Completo</th>
                        <th>Email / Telefono</th>
                        <th>Edad / Género</th>
                        <th>Club</th>
                        <th>Licencia 2026</th>
                        <th>Categorías</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="jugadoresTable">
                    <!-- Injected -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Tab Torneos -->
    <div id="tabContent-torneos" class="tab-content" style="display: none;">
        <div class="admin-card">
            <table>
                <thead>
                    <tr>
                        <th>Etapa</th>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="torneosTable">
                    <!-- Injected -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="overlay" class="overlay" onclick="closeModal()"></div>
    <div id="modal" class="modal">
        <h3 id="modalTitle" style="margin-bottom: 1.5rem;">Título</h3>
        <div id="modalContent" style="max-height: 400px; overflow-y: auto;">
            <!-- Injected -->
        </div>
        <button onclick="closeModal()" class="btn btn-primary" style="margin-top: 1.5rem; width: 100%;">Cerrar</button>
    </div>

    <script>
        // --- Estado Global para evitar problemas de escape en HTML ---
        let state = {
            jugadores: [],
            torneos: [],
            rankingNames: [],
            adminSecret: localStorage.getItem('adminSecret')
        };

        // Helpers
        function normalizeString(s) {
            if (!s) return '';
            // Normalización extrema: minúsculas, sin acentos, sin puntuación, espacio simple
            return s.toString().toLowerCase().normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]/g, " ") 
                .replace(/\s+/g, " ")
                .trim();
        }

        function getLevenshtein(a, b) {
            const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    matrix[i][j] = b[i - 1] === a[j - 1] ? matrix[i - 1][j - 1] : Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                }
            }
            return matrix[b.length][a.length];
        }

        function findBestMatch(player, officialNames) {
            if (!Array.isArray(officialNames) || officialNames.length === 0) {
                console.warn('Matching: No hay nombres oficiales para comparar.');
                return null;
            }
            const pNick = normalizeString(player.nickname);
            const pName = normalizeString(player.nombre_completo);
            let best = null;
            let bestDist = 999;

            for (const offName of officialNames) {
                const normOff = normalizeString(offName);
                if (normOff === pNick || normOff === pName) {
                    console.log(`Matching: EXACTO para ${player.nickname} -> ${offName}`);
                    return { name: offName, type: 'exact' };
                }
                
                const dist = Math.min(getLevenshtein(pNick, normOff), getLevenshtein(pName, normOff));
                if (dist < bestDist) {
                    bestDist = dist;
                    best = offName;
                }
            }
            
            if (bestDist <= 3) {
                console.log(`Matching: FUZZY para ${player.nickname} -> Sugerido: ${best} (dist: ${bestDist})`);
                return { name: best, type: 'fuzzy' };
            }
            
            console.log(`Matching: FALLO para ${player.nickname}. Sin coincidencias cercanas.`);
            return null;
        }

        async function api(path, method = 'GET', body = null) {
            const headers = {
                'x-admin-secret': state.adminSecret,
                'Content-Type': 'application/json'
            };
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);

            try {
                const res = await fetch(`/api/${path}`, options);
                if (res.status === 401) {
                    logout();
                    return null;
                }
                return await res.json();
            } catch (err) {
                console.error('API Error:', err);
                return null;
            }
        }

        async function handleLogin(explicitSecret = null) {
            const input = document.getElementById('secretInput').value;
            state.adminSecret = explicitSecret || input;
            
            const data = await api('admin/jugadores');
            if (data) {
                localStorage.setItem('adminSecret', state.adminSecret);
                document.getElementById('loginOverlay').style.display = 'none';
                renderData();
            } else if (!explicitSecret) {
                alert('Clave incorrecta');
            }
        }

        function logout() {
            localStorage.removeItem('adminSecret');
            location.reload();
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tabContent-${tab}`).style.display = 'block';
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        async function renderData() {
            const [jugadores, torneos, rankingNames] = await Promise.all([
                api('admin/jugadores'),
                api('etapas/listado'),
                api('admin/clasificacion-nombres')
            ]);

            state.jugadores = Array.isArray(jugadores) ? jugadores : [];
            state.torneos = Array.isArray(torneos) ? torneos : [];
            state.rankingNames = Array.isArray(rankingNames) ? rankingNames : [];

            console.log('DEBUG: Jugadores recibidos:', state.jugadores.length);
            console.log('DEBUG: Ranking names recibidos:', state.rankingNames);

            // Render Jugadores
            const jTable = document.getElementById('jugadoresTable');
            jTable.innerHTML = state.jugadores.map((j, idx) => {
                const match = j.tiene_licencia ? findBestMatch(j, state.rankingNames) : null;
                const statusColor = match ? (match.type === 'exact' ? '#10b981' : '#f59e0b') : '#ef4444';
                const matchText = match ? `Nick Clasif: <b>${match.name}</b>` : (j.tiene_licencia ? '⚠️ No encontrado' : '');

                return `
                <tr>
                    <td>
                        <div style="font-weight:800; color:var(--primary-color)">${j.nickname}</div>
                        ${matchText ? `<div style="font-size:0.75rem; color:${statusColor}; margin-top:0.2rem">${matchText}</div>` : ''}
                    </td>
                    <td style="font-size:0.9rem">${j.nombre_completo || '-'}</td>
                    <td style="font-size:0.8rem">${j.email}<br><span style="opacity:0.6">${j.telefono || '-'}</span></td>
                    <td style="font-size:0.8rem">${j.fecha_nacimiento || '-'}<br><span style="opacity:0.6">${j.genero || '-'}</span></td>
                    <td style="font-size:0.8rem">${j.club || 'Independiente'}</td>
                    <td>
                        <span class="badge ${j.tiene_licencia ? 'badge-success' : 'badge-error'}">${j.tiene_licencia ? 'SÍ' : 'NO'}</span>
                        <div style="font-size:0.75rem; opacity:0.6; margin-top:0.2rem">Desde: ${j.anio_licencia || '-'}</div>
                    </td>
                    <td><span style="font-size:0.8rem">${(j.categorias_calculadas || []).join(', ') || '-'}</span></td>
                    <td>
                        <button onclick="uiEditJugador(${idx})" class="btn btn-sm">Editar</button>
                        <button onclick="uiNormalizar(${idx})" class="btn btn-sm" style="color:#60a5fa">Norm.</button>
                    </td>
                </tr>
                `;
            }).join('');

            // Render Torneos
            const tTable = document.getElementById('torneosTable');
            tTable.innerHTML = state.torneos.map((t, idx) => `
                <tr>
                    <td>${t.nombre}</td>
                    <td>${new Date(t.fecha).toLocaleDateString()}</td>
                    <td>${(t.tipo || 'Etapa').toUpperCase()}</td>
                    <td><span class="badge ${t.estado === 'abierta' ? 'badge-success' : 'badge-error'}">${(t.estado || '').toUpperCase()}</span></td>
                    <td>
                        <div style="display:flex; gap:0.5rem">
                            <button onclick="uiVerInscritos(${idx})" class="btn btn-sm btn-primary">Inscritos</button>
                            ${t.estado !== 'finalizada' ? `<button onclick="uiCargarResultados(${idx})" class="btn btn-sm" style="background:var(--secondary-color)">Cargar</button>` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Acciones UI
        function uiEditJugador(idx) {
            openModal('editar-jugador', state.jugadores[idx]);
        }

        async function uiNormalizar(idx) {
            const player = state.jugadores[idx];
            const match = findBestMatch(player, state.rankingNames);
            const suggested = match ? match.name : player.nombre_completo;

            if (!suggested || !confirm(`¿Normalizar Nickname de "${player.nickname}" a "${suggested}"?`)) return;

            const res = await api('admin/modificar-jugador', 'POST', {
                ...player,
                nickname: suggested
            });
            if (res && res.ok) renderData();
        }

        async function uiVerInscritos(idx) {
            const t = state.torneos[idx];
            verInscritos(t.id, t.nombre);
        }

        function uiCargarResultados(idx) {
            const t = state.torneos[idx];
            state.activeEtapa = t;
            openModal('cargar-resultados', t);
        }

        // Modales
        function openModal(type, extra = null) {
            const modal = document.getElementById('modal');
            const overlay = document.getElementById('overlay');
            const content = document.getElementById('modalContent');
            document.getElementById('modalTitle').textContent = type.toUpperCase();

            // Lógica de formularios simplificada
            if (type === 'nuevo-jugador') {
                content.innerHTML = `
                    <form onsubmit="handleCrearJugador(event)">
                        <input type="text" name="nombre" placeholder="Nombre Completo" class="btn" style="width:100%; margin-bottom:1rem" required>
                        <input type="text" name="nickname" placeholder="Nickname" class="btn" style="width:100%; margin-bottom:1rem" required>
                        <input type="email" name="email" placeholder="Email" class="btn" style="width:100%; margin-bottom:1rem" required>
                        <button type="submit" class="btn btn-primary" style="width:100%">Guardar</button>
                    </form>`;
            } else if (type === 'editar-jugador') {
                const j = extra;
                content.innerHTML = `
                    <form onsubmit="handleModificarJugador(event, '${j.id}')">
                        <input type="text" name="nombre" value="${j.nombre_completo || ''}" class="btn" style="width:100%; margin-bottom:1rem">
                        <input type="text" name="nickname" value="${j.nickname || ''}" class="btn" style="width:100%; margin-bottom:1rem">
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem">
                            <div>
                                <label style="font-size:0.8rem; opacity:0.7">Licencia:</label>
                                <select name="tiene_licencia" class="btn" style="width:100%">
                                    <option value="true" ${j.tiene_licencia ? 'selected' : ''}>SÍ</option>
                                    <option value="false" ${!j.tiene_licencia ? 'selected' : ''}>NO</option>
                                </select>
                            </div>
                            <div>
                                <label style="font-size:0.8rem; opacity:0.7">Año 1ª Licencia:</label>
                                <input type="number" name="anio_licencia" value="${j.anio_licencia || 2026}" class="btn" style="width:100%">
                            </div>
                        </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">Actualizar</button>
                    </form>`;
            } else if (type === 'nueva-inscripcion') {
                const {id, nombre} = extra;
                document.getElementById('modalTitle').textContent = `Inscripciones: ${nombre}`;
                content.innerHTML = `
                    <form onsubmit="handleInscribirManual(event, ${id}, '${nombre}')">
                        <div style="margin-bottom:1rem">
                            <label style="font-size:0.8rem; opacity:0.7">Seleccionar Jugador:</label>
                            <select name="jugador_id" class="btn" style="width:100%" required>
                                <option value="">-- Elige un jugador --</option>
                                ${state.jugadores.map(j => `<option value="${j.id}">${j.nickname} (${j.nombre_completo || ''})</option>`).join('')}
                            </select>
                        </div>
                        <div style="margin-bottom:1rem">
                            <label style="font-size:0.8rem; opacity:0.7">Nombre Manual (Solo si no está en la lista):</label>
                            <input type="text" name="nombre_manual" placeholder="Escribir nombre si es nuevo..." class="btn" style="width:100%">
                        </div>
                        <div style="margin-bottom:1rem">
                            <label style="font-size:0.8rem; opacity:0.7">Equipo / Jornada (Opcional):</label>
                            <input type="text" name="equipo_nombre" placeholder="Nombre equipo..." class="btn" style="width:100%">
                        </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">Confirmar Inscripción</button>
                    </form>`;
            } else if (type === 'cargar-resultados') {
                const t = extra;
                content.innerHTML = `
                    <div id="step-upload">
                        <p style="font-size:0.9rem; margin-bottom:1rem">Sube el Excel oficial para procesar <b>${t.nombre}</b>.</p>
                        <input type="file" id="excelInput" accept=".xlsx,.xls" class="btn" style="width:100%; margin-bottom:1rem">
                        <button onclick="processStepPreview()" class="btn btn-primary" style="width:100%">Analizar Archivo</button>
                    </div>
                    <div id="step-ties" style="display:none">
                        <p style="background:#fef3c7; color:#92400e; padding:0.5rem; border-radius:4px; font-size:0.8rem; margin-bottom:1rem">
                            ⚠️ Se han detectado empates en el Podium. Indica quién ganó el desempate en cada categoría.
                        </p>
                        <div id="tiesList"></div>
                        <button onclick="processStepPreview(true)" class="btn btn-primary" style="width:100%; margin-top:1rem">Recalcular con Desempates</button>
                    </div>
                    <div id="step-preview" style="display:none">
                        <p style="font-size:0.9rem; margin-bottom:1rem">Vista previa de puntos calculados:</p>
                        <div id="previewTable" style="max-height:250px; overflow-y:auto; border:1px solid #ddd; margin-bottom:1rem"></div>
                        <button onclick="processStepPublish()" class="btn btn-sm" style="width:100%; background:#10b981; color:white">Publicar Resultados</button>
                    </div>
                `;
            }

            modal.style.display = 'block';
            overlay.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        async function handleCrearJugador(e) {
            e.preventDefault();
            const f = e.target;
            const res = await api('admin/crear-jugador', 'POST', {
                nombre_completo: f.nombre.value,
                nickname: f.nickname.value,
                email: f.email.value
            });
            if (res && res.ok) { closeModal(); renderData(); }
        }

        async function handleModificarJugador(e, id) {
            e.preventDefault();
            const f = e.target;
            const res = await api('admin/modificar-jugador', 'POST', {
                id,
                nombre_completo: f.nombre.value,
                nickname: f.nickname.value,
                tiene_licencia: f.tiene_licencia.value === 'true',
                anio_licencia: f.anio_licencia.value
            });
            if (res && res.ok) { closeModal(); renderData(); }
        }

        async function verInscritos(id, nombre) {
            const inscritos = await api(`admin/inscripciones?etapa_id=${id}`);
            if (!inscritos) return;

            document.getElementById('modalTitle').textContent = `Inscritos: ${nombre}`;
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div style="display:flex; justify-content:flex-end; margin-bottom:1rem">
                    <button onclick="openModal('nueva-inscripcion', {id:${id}, nombre:'${nombre}'})" class="btn btn-sm btn-primary">+ Añadir a Mano</button>
                </div>
                <table style="font-size:0.9rem">
                    ${inscritos.map(i => `
                        <tr>
                            <td>${i.jugadores ? i.jugadores.nickname : (i.nombre_manual || '???')}</td>
                            <td>${i.equipo_nombre || 'Individual'}</td>
                            <td><button onclick="handleEliminar('${i.id}', ${id}, '${nombre}')" class="btn btn-sm" style="color:red">Baja</button></td>
                        </tr>
                    `).join('')}
                </table>
            `;
            document.getElementById('modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        async function handleEliminar(id, etapaId, etapaNombre) {
            if (!confirm('¿Dar de baja?')) return;
            const res = await api('admin/eliminar-inscripcion', 'POST', { id });
            if (res && res.ok) verInscritos(etapaId, etapaNombre);
        }

        async function handleInscribirManual(e, etapaId, etapaNombre) {
            e.preventDefault();
            const f = e.target;
            const res = await api('admin/inscripcion-manual', 'POST', {
                etapa_id: etapaId,
                jugador_id: f.jugador_id.value || null,
                nombre_manual: f.nombre_manual.value || null,
                equipo_nombre: f.equipo_nombre.value || null
            });
            if (res && res.ok) {
                closeModal();
                verInscritos(etapaId, etapaNombre);
            } else {
                alert('Error al inscribir: ' + (res ? res.error : 'Fallo de red'));
            }
        }

        let currentFileBase64 = null;
        let currentDesempates = {};

        async function processStepPreview(isRetry = false) {
            const input = document.getElementById('excelInput');
            if (!isRetry) {
                if (!input.files[0]) return alert('Selecciona un archivo');
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = async (e) => {
                    currentFileBase64 = e.target.result.split(',')[1];
                    sendPreview();
                };
                reader.readAsDataURL(file);
            } else {
                sendPreview();
            }
        }

        async function sendPreview() {
            const res = await api('clasificacion/procesar-etapa', 'POST', {
                etapa_id: state.activeEtapa.id,
                excel_base64: currentFileBase64,
                mode: 'preview',
                desempates: currentDesempates
            });

            if (!res || !res.ok) return alert('Error al analizar archivo');

            if (res.empatesDetectados && res.empatesDetectados.length > 0) {
                document.getElementById('step-upload').style.display = 'none';
                document.getElementById('step-preview').style.display = 'none';
                document.getElementById('step-ties').style.display = 'block';
                
                const list = document.getElementById('tiesList');
                list.innerHTML = res.empatesDetectados.map((e, idx) => `
                    <div style="margin-bottom:1rem; border-bottom:1px dashed #ccc; padding-bottom:0.5rem">
                        <div style="font-weight:bold; font-size:0.8rem">${e.categoria} (Score: ${e.score})</div>
                        <div style="display:flex; gap:0.5rem; margin-top:0.4rem">
                            ${e.jugadores.map(j => `
                                <button onclick="resolveTie('${e.categoria}', '${j.id}')" 
                                        class="btn btn-sm ${currentDesempates[j.id] ? 'btn-primary' : ''}" 
                                        style="font-size:0.7rem">
                                    ${j.nickname}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            } else {
                document.getElementById('step-upload').style.display = 'none';
                document.getElementById('step-ties').style.display = 'none';
                document.getElementById('step-preview').style.display = 'block';
                
                const table = document.getElementById('previewTable');
                table.innerHTML = `
                    <table style="font-size:0.75rem; width:100%">
                        <thead><tr><th>Jugador</th><th>Score</th><th>Absoluta</th></tr></thead>
                        <tbody>
                            ${res.puntosCalculados.slice(0, 10).map(p => `
                                <tr>
                                    <td>${p.nickname}</td>
                                    <td>${p.score}</td>
                                    <td>${p.puntos['Absoluta'] || 0}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
        }

        function resolveTie(cat, playerId) {
            currentDesempates[playerId] = true;
            sendPreview();
        }

        async function processStepPublish() {
            if (!confirm('¿Estás seguro? Esto cerrará la etapa y actualizará la clasificación pública.')) return;
            const res = await api('clasificacion/procesar-etapa', 'POST', {
                etapa_id: state.activeEtapa.id,
                excel_base64: currentFileBase64,
                mode: 'commit',
                desempates: currentDesempates
            });
            if (res && res.ok) {
                alert('Etapa publicada con éxito');
                closeModal();
                renderData();
            }
        }

        // Inicio
        if (state.adminSecret) handleLogin(state.adminSecret);

    </script>
</body>
</html>
