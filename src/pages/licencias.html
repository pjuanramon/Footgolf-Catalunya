<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Licencia - Footgolf Catalunya</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/main.css">
    <script src="/js/Navbar.js" defer></script>
    <script src="/js/Footer.js" defer></script>
    <style>
        .form-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.8rem;
            color: white;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .price-display {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
            color: white;
        }

        .price-value {
            font-size: 3rem;
            font-weight: 800;
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .form-container {
                padding: 1.5rem;
                margin: 1rem;
            }
        }
    </style>
</head>

<body>
    <app-navbar></app-navbar>

    <main>
        <header class="page-header">
            <h1 class="gradient-text">Solicitud de Licencia 2026</h1>
            <p>Completa tus datos para federarte y empezar a puntuar en el ranking oficial.</p>
        </header>

        <div class="container">
            <div class="form-container">
                <div class="price-display">
                    <span style="font-size: 0.9rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px;">Importe Licencia Actual</span>
                    <span class="price-value" id="price-value">--€</span>
                    <p style="margin: 0; font-size: 0.9rem; opacity: 0.8;">* El precio se calcula según las etapas restantes para nuevos jugadores.</p>
                </div>

                <form id="licencia-form" class="form-grid">
                    <div class="form-group">
                        <label for="nickname">Nickname (como quieres aparecer en el ranking) *</label>
                        <input type="text" id="nickname" name="nickname" required placeholder="Ej: Tiger">
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico *</label>
                        <input type="email" id="email" name="email" required placeholder="tu@email.com">
                    </div>

                    <div class="form-group">
                        <label for="nombre_completo">Nombre Completo</label>
                        <input type="text" id="nombre_completo" name="nombre_completo" placeholder="Tu nombre y apellidos">
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="+34 600 000 000">
                    </div>

                    <div class="form-group">
                        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                    </div>

                    <div class="form-group">
                        <label for="genero">Género</label>
                        <select id="genero" name="genero">
                            <option value="masculino">Masculino</option>
                            <option value="femenino">Femenino</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="club">Club (opcional)</label>
                        <input type="text" id="club" name="club" placeholder="Nombre de tu club">
                    </div>

                    <div class="form-group">
                        <label for="anio_primera_licencia">¿Es tu primera licencia?</label>
                        <select id="anio_primera_licencia" name="anio_primera_licencia" required>
                            <option value="2026">Sí, es mi primer año</option>
                            <option value="2025">No, ya tenía licencia antes</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" class="btn btn-primary btn-submit" id="btn-submit">
                            Continuar al Pago con Stripe →
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <app-footer></app-footer>

    <script>
        const form = document.getElementById('licencia-form');
        const priceDisplay = document.getElementById('price-value');
        const submitBtn = document.getElementById('btn-submit');

        // Función para estimar precio (el real se calcula en el servidor)
        async function fetchInitialPrice() {
            try {
                // Hacemos un fetch placeholder para que el usuario vea el precio aproximado
                const res = await fetch('/api/licencias/crear-sesion-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'preview@price.com', nickname: 'preview', anio_primera_licencia: 2026 })
                });
                const data = await res.json();
                if (data.precio) {
                    priceDisplay.textContent = `${data.precio}€`;
                }
            } catch (e) {}
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Procesando...';

            const formData = new FormData(form);
            const body = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('/api/licencias/crear-sesion-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert(data.error || 'Error al iniciar el pago');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Continuar al Pago con Stripe →';
                }
            } catch (err) {
                alert('Error de conexión con el servidor');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Continuar al Pago con Stripe →';
            }
        });

        // Al iniciar, si hay un resultado en la URL (exito/cancelado)
        const params = new URLSearchParams(window.location.search);
        if (params.get('resultado') === 'exito') {
            alert('¡Pago completado con éxito! Recibirás un email de confirmación en breve.');
        } else if (params.get('resultado') === 'cancelado') {
            alert('El pago ha sido cancelado.');
        }

        fetchInitialPrice();
    </script>
</body>

</html>
